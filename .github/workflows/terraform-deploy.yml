name: Home Server CI/CD

on:
  push:
    branches:
      - main

env:
  # イメージの宛先（※すべて小文字で指定）
  BACKEND_IMAGE: ghcr.io/murakamihonami/streeeak-backend
  FRONTEND_IMAGE: ghcr.io/murakamihonami/streeeak-frontend

jobs:
  # ---------------------------------------------------
  # ① ビルド＆プッシュ（GHCRへ）
  # ---------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCRにアップロードするための権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }} # 自動で発行されるトークンを使用

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

  # ---------------------------------------------------
  # ② デプロイ（自宅サーバーへの遠隔操作）
  # ---------------------------------------------------
  deploy:
    name: Deploy to Home Server
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.66.4

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        # ↓ 追加：ロボットにパスワードを変数として持たせる
        env:
          PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PASSWORD # ← 追加：サーバー内に変数を持ち込む
          script: |
            cd ~/streeeak
            # ↓ 変更：echoを使ってロボットにパスワードを自動入力させる
            echo $PASSWORD | sudo -S docker compose pull
            echo $PASSWORD | sudo -S docker compose up -d
            echo $PASSWORD | sudo -S docker image prune -f
            # 最新のイメージをダウンロード
            sudo docker compose pull
            # 古いコンテナを破棄して最新版で立ち上げ直す
            sudo docker compose up -d
            # 不要になった古いイメージを削除して容量を節約
            sudo docker image prune -f